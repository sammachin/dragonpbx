[rtpengine-recording]
# Spool dir rtpengine writes raw stream metadata/packets into (--recording-dir
# in rtpengine.service), and the output dir for the mixed/decoded files.
spool-dir = /var/spool/recording
output-dir = /recording
output-format = wav
output-mixed = yes
output-single = no
resample = yes
resample-to = 16000
log-level = 5
