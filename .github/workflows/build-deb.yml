name: Build .deb

# Build the DragonPBX all-in-one .deb for amd64 and arm64 whenever a release tag
# is pushed, and attach both to that tag's GitHub Release. The arm64 package
# installs on 64-bit Raspberry Pi OS (Pi 5) and generic arm64 Debian servers.
# Reuses packaging/build-docker.sh — the same script used to build locally.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on the .deb (defaults to the tag)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest      # native amd64
          - arch: arm64
            runner: ubuntu-24.04-arm    # native arm64 — no QEMU
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the version: the tag on a tag push, or the manual input.
      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building dragonpbx_${V}_${{ matrix.arch }}.deb"

      # Stage a clean copy of the app source: everything in the repo EXCEPT the
      # packaging scaffolding and CI, so /opt/dragonpbx/app matches a plain app checkout.
      - name: Stage app source (excluding packaging/.github)
        run: |
          mkdir -p /tmp/appsrc
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='packaging' \
            --exclude='output' \
            ./ /tmp/appsrc/

      - name: Build .deb (Debian bookworm container, same as local build)
        run: |
          ARCH_DEB=${{ matrix.arch }} \
          PLATFORM=linux/${{ matrix.arch }} \
          DRAGONPBX_VERSION=local \
          APP_PATH=/tmp/appsrc \
          DEB_VERSION="${{ steps.ver.outputs.version }}" \
          packaging/build-docker.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonpbx-deb-${{ matrix.arch }}
          path: packaging/output/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the .deb files to the Release
    steps:
      - name: Download all built .debs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Attach .debs to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/**/*.deb
          fail_on_unmatched_files: true
